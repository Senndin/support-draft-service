# Підйом стеку: cp .env.example .env && docker compose up
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"  # доступ до Ollama на хості

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # лише з локальної машини: для тестів, не для мережі
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Одноразовий сервіс: застосовує міграції, сіє базу знань і завершується
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_kb"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
