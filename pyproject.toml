[project]
name = "support-draft-service"
version = "0.1.0"
description = "Сервіс чернеток відповідей підтримки на базі LLM"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
