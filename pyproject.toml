[project]
name = "support-draft-service"
version = "0.1.0"
description = "Сервіс чернеток відповідей підтримки на базі LLM"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "httpx",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# один event loop на весь прогін: engine тестової БД живе всю сесію
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
